; Findy P0 — RAK4631 (nRF52840 + SX1262). DERLENMEDİ: bu makinede PlatformIO ve RAK çekirdeği yok.
[platformio]
default_envs = rak4631

[env:rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
; findy_core C++17 ister; Adafruit nRF52 çekirdeği varsayılan olarak gnu++11 kullanır. DOĞRULANACAK: araç zinciri C++17'yi destekliyor mu.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DFINDY_TARGET_RAK4631
    -DCONFIG_NFCT_PINS_AS_GPIOS
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.27
; Bluefruit ve Adafruit_LittleFS/InternalFS, nRF52 BSP içindedir (lib_deps gerekmez).
; lib/findy_core proje kütüphanesi olarak otomatik bulunur.
monitor_speed = 115200

; PC birim testleri. Esas yol: bash test/run_native_tests.sh (yalnızca g++).
; Bu env PlatformIO'da DENENMEDİ; test_core.cpp kendi main()'ini içerdiğinden özel çalıştırıcı kullanır.
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_framework = custom
test_build_src = no
